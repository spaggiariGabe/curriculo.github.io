<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo Gabriel Spaggiari</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-size: cover;
        }
        nav {
            background-color: rgba(135, 209, 193, 0.5);
            padding: 12px;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            flex-wrap: wrap;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            background-color: black;
            margin: 4px;
        }
        nav a:hover {
            background-color: rgba(33, 66, 60, 0.815);
        }
        .intro-container, .intro-container2, .intro-container3, .intro-container4 {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 8% 5%;
            background-color: rgba(202, 252, 241, 0.932);
            border-radius: 10px;
            padding: 20px;
        }
        .intro-image {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            border: double 2px rgba(5, 41, 27, 0.842);
            margin-bottom: 10px;
        }
        .banner-container {
            position: relative;
            width: 95%;
            height: auto;
            overflow: hidden;
            border-radius: 10px;
            margin: 20px auto;
        }
        .banner img {
            width: 100%;
            height: auto;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .banner img.active {
            opacity: 1;
        }
        .indicators {
            text-align: center;
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .indicator {
            height: 12px;
            width: 12px;
            background-color: rgba(98, 156, 144, 0.8);
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }
        .indicator.active {
            background-color: rgb(241, 144, 217);
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .button {
            background-color: #4ca793;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            text-align: center;
        }
        .button:hover {
            background-color: #40998a;
            transform: scale(1.05);
        }
        .contact-banner {
            position: relative;
            width: 90%;
            height: 300px;
            margin: 10% auto;
            background-size: cover;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .contact-banner a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-size: 20px;
        }
        footer {
            background-color: rgba(98, 156, 144, 0.5);
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: center;
            }
            nav a {
                padding: 8px;
                font-size: 14px;
            }
            .intro-container, .intro-container2, .intro-container3, .intro-container4 {
                margin: 10% 5%;
            }
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            .button {
                width: 80%;
            }
            .contact-banner {
                height: auto;
                padding: 20px;
            }
            .contact-banner a {
                font-size: 18px;
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#sobre">Sobre</a>
        <a href="#minha-trajetoria">Minha Trajetória</a>
        <a href="#competencias-habilidades">Competências</a>
        <a href="#motivacao">Motivação</a>
        <a href="#trabalhos">Trabalhos</a>
        <a href="#contatos">Contatos</a>
    </nav>
    <div class="intro-container">
        <img src="me.png" alt="Foto Gabriel Spaggiari" class="intro-image">
        <h2>Gabriel Spaggiari</h2>
        <p>Bem-vindo ao meu currículo online!</p>
    </div>
    <div class="banner-container">
        <div class="banner">
            <img src="nalatavalk.png" class="active" alt="Imagem 1">
            <img src="viper_BE.png" alt="Imagem 2">
            <img src="psi_BE.png" alt="Imagem 3">
        </div>
        <div class="indicators">
            <span class="indicator active"></span>
            <span class="indicator"></span>
            <span class="indicator"></span>
        </div>
    </div>
    <div id="contatos" class="contact-banner">
        <a href="https://wa.me/+5511949674045" target="_blank">WhatsApp</a>
        <a href="https://www.linkedin.com/in/gabriel-spaggiari-a7b52521b/" target="_blank">LinkedIn</a>
        <a href="mailto:gabspaggiari@gmail.com">Email</a>
    </div>
    <footer>
        <p>© 2025 Gabriel Spaggiari</p>
    </footer>
</body>
</html>
